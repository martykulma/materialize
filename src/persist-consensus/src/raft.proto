syntax = "proto3";

package mz_persist_consensus.raft;

service RaftService {
    rpc AppendEntries(ProtoRaftRequest) returns (ProtoRaftResponse);
    rpc InstallSnapshot(ProtoRaftRequest) returns (ProtoRaftResponse);
    rpc Vote(ProtoRaftRequest) returns (ProtoRaftResponse);
}

message ProtoRaftRequest {
    bytes payload = 1;
}

message ProtoRaftResponse {
    bytes payload = 1;
}
