[package]
name = "mz-persist-consensus"
description = "Raft-backed consensus service for Materialize persist."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "persist-consensus"
path = "src/bin/persist-consensus.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.101"
async-stream = "0.3.6"
async-trait = "0.1.89"
bytes = "1.11.1"
clap = { version = "4.5.23", features = ["derive"] }
futures = "0.3.31"
futures-util = "0.3"
mz-ore = { path = "../ore", default-features = false, features = ["bytes", "process", "panic", "tracing"] }
mz-persist = { path = "../persist" }
num_cpus = "1.17.0"
openraft = { version = "0.9", features = ["serde"] }
prost = { version = "0.14.3", features = ["no-recursion-limit"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.48.0", default-features = false, features = ["macros", "sync", "rt", "rt-multi-thread", "net"] }
tokio-stream = "0.1.18"
tonic = "0.14.2"
tonic-prost = "0.14.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
workspace-hack = { version = "0.0.0", path = "../workspace-hack", optional = true }

[build-dependencies]
mz-build-tools = { path = "../build-tools", default-features = false, features = ["protobuf-src"] }
prost-build = "0.14.3"
tonic-prost-build = "0.14.2"

[features]
default = ["mz-build-tools/default", "workspace-hack"]

[package.metadata.cargo-udeps.ignore]
normal = ["workspace-hack"]
