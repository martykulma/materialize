services:
  minio:
    image: minio/minio
    container_name: s3_consensus_minio
    environment:
      - MINIO_ROOT_USER=demo
      - MINIO_ROOT_PASSWORD=demodemo123
      - MINIO_DOMAIN=minio
    networks:
      s3_consensus_net:
        aliases:
          - demo.minio
    ports:
      - 9001:9001
      - 9000:9000
    command: ["server", "/data", "--console-address", ":9001"]
  mc:
    depends_on:
      - minio
    image: minio/mc
    container_name: s3_consensus_mc
    networks:
      s3_consensus_net:
    environment:
      - AWS_ACCESS_KEY_ID=demo
      - AWS_SECRET_ACCESS_KEY=demodemo123
      - AWS_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 demo demodemo123) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc rm -r --force minio/demo;
      /usr/bin/mc mb minio/demo;
      /usr/bin/mc admin policy attach minio readwrite --user=demo;
      /usr/bin/mc anonymous set public minio/demo;
      tail -f /dev/null
      "
networks:
  s3_consensus_net:
