syntax = "proto3";

package mz_persist_consensus_client.service;

service PersistConsensusService {
    rpc Head(HeadRequest) returns (HeadResponse);
    rpc CompareAndSet(CaSRequest) returns (CaSResponse);
    rpc Scan(ScanRequest) returns (ScanResponse);
    rpc Truncate(TruncateRequest) returns (TruncateResponse);
    rpc ListKeys(ListKeysRequest) returns (stream ListKeysResponse);
}

message ProtoVersionedData {
    uint64 seqno = 1;
    bytes data = 2;
}

message HeadRequest {
    string key = 1;
}

message HeadResponse {
    optional ProtoVersionedData value = 1;
}

message CaSRequest {
    string key = 1;
    optional uint64 expected = 2;
    uint64 new_seqno = 3;
    bytes new_data = 4;
}

enum ProtoCaSResult {
    COMMITTED = 0;
    EXPECTATION_MISMATCH = 1;
}

message CaSResponse {
    ProtoCaSResult result = 1;
}

message ScanRequest {
    string key = 1;
    uint64 from = 2;
    uint64 limit = 3;
}

message ScanResponse {
    repeated ProtoVersionedData values = 1;
}

message TruncateRequest {
    string key = 1;
    uint64 seqno = 2;
}

message TruncateResponse {
    optional uint64 deleted = 1;
}

message ListKeysRequest {}

message ListKeysResponse {
    string key = 1;
}
